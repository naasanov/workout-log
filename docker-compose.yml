services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: workout_log
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    # Schema and seed data are NOT applied via docker-entrypoint-initdb.d. That mechanism
    # only fires once, on a truly empty data directory, and previously mounted just
    # migrations 001-006 (stale — the repo has migrations through 017) with no row written
    # to schema_migrations, which left `npm run migrate` unable to tell what had already
    # been applied. `scripts/migrate.js` + the `schema_migrations` table are now the single
    # source of truth for schema state, for both fresh and pre-existing containers alike.
    # After `docker compose up -d`, run (from the repo root, with DB_PORT=3307):
    #   npm run db:setup
    # See .claude/skills/browser-verify/SKILL.md ("Booting the dev stack") for the full flow.

volumes:
  db_data:
